openapi: 3.0.3
info:
  title: LMS Mini M1 API
  version: 1.0.0
  description: M1 authentication, course, enrollment, and module availability endpoints.
servers:
  - url: http://localhost:5000
tags:
  - name: M1 Core
paths:
  /api/auth/login:
    post:
      tags: [M1 Core]
      summary: Authenticate with username or email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  description: Username or email address
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Required credentials are missing.
        "401":
          description: Credentials are invalid.
        "403":
          description: Account is locked or temporarily locked.
        "429":
          description: Login rate limit exceeded.
  /api/auth/refresh:
    post:
      tags: [M1 Core]
      summary: Rotate a refresh token and issue a new access token
      operationId: refreshSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Session tokens rotated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Refresh token is missing.
        "401":
          description: Refresh token is invalid, expired, or revoked.
  /api/auth/logout:
    post:
      tags: [M1 Core]
      summary: Revoke all sessions for the authenticated user
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        "204":
          description: All sessions were revoked.
        "401":
          description: Authentication is required.
  /api/users:
    get:
      tags: [M1 Core]
      summary: Search users with pagination
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
        - name: role
          in: query
          schema:
            type: string
            enum: [ADMIN, GIANG_VIEN, SINH_VIEN]
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, LOCKED, TEMPORARY_LOCKED]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paginated accounts. Password hashes are never returned.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, limit]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ManagedUser"
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
        "401":
          description: Authentication is required.
        "403":
          description: Only Admin can manage users.
    post:
      tags: [M1 Core]
      summary: Create an account with a one-time random initial password
      operationId: createUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUser"
      responses:
        "201":
          description: Account created. The initial password is returned once and must be shared securely.
          content:
            application/json:
              schema:
                type: object
                required: [user, initialPassword]
                properties:
                  user:
                    $ref: "#/components/schemas/ManagedUser"
                  initialPassword:
                    type: string
                    format: password
        "403":
          description: Only Admin can manage users.
        "409":
          description: Username or email is already in use.
        "422":
          description: User details are invalid.
  /api/users/{userId}/status:
    parameters:
      - $ref: "#/components/parameters/UserId"
    patch:
      tags: [M1 Core]
      summary: Lock or unlock an account and revoke its sessions
      operationId: updateUserStatus
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ACTIVE, LOCKED]
      responses:
        "200":
          description: Account status changed; existing sessions were invalidated.
        "403":
          description: Only Admin can manage users, or Admin attempted to lock their own account.
        "404":
          description: Account not found.
        "422":
          description: Status is invalid.
  /api/users/{userId}/role:
    parameters:
      - $ref: "#/components/parameters/UserId"
    patch:
      tags: [M1 Core]
      summary: Change an account role and revoke sessions
      operationId: updateUserRole
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [ADMIN, GIANG_VIEN, SINH_VIEN]
      responses:
        "200":
          description: Account role changed; existing sessions were invalidated.
        "403":
          description: Only Admin can manage users.
        "404":
          description: Account or role not found.
        "422":
          description: Role is invalid.
  /api/users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    delete:
      tags: [M1 Core]
      summary: Soft-delete an account and revoke its sessions
      operationId: softDeleteUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Account soft-deleted. User records are never hard-deleted.
        "403":
          description: Only Admin can manage users.
        "404":
          description: Account not found.
  /api/courses/{courseId}/lessons:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      tags: [M1 Core]
      summary: List lessons and their materials for an accessible course
      operationId: listCourseLessons
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lessons with material metadata, excluding physical storage paths.
        "403":
          description: Caller is neither the course owner nor an enrolled student.
        "404":
          description: Course not found.
    post:
      tags: [M1 Core]
      summary: Create a lesson in an instructor-owned course
      operationId: createLesson
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonInput"
      responses:
        "201":
          description: Lesson created.
        "403":
          description: Caller is not the instructor who owns the course.
        "404":
          description: Course not found.
        "422":
          description: Lesson details are invalid.
  /api/lessons/{lessonId}/materials:
    parameters:
      - $ref: "#/components/parameters/LessonId"
    get:
      tags: [M1 Core]
      summary: List materials for an accessible lesson
      operationId: listLessonMaterials
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Material metadata visible to an authorized course member.
        "403":
          description: Caller has no access to the lesson's course.
        "404":
          description: Lesson not found.
    post:
      tags: [M1 Core]
      summary: Upload a lesson material
      operationId: uploadLessonMaterial
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, file]
              properties:
                title:
                  type: string
                  maxLength: 200
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: File was validated, stored with a UUID, and linked to the lesson.
        "400":
          description: File is missing, unsupported, malformed, or larger than 50 MB.
        "403":
          description: Caller is not the instructor who owns the lesson's course.
        "404":
          description: Lesson not found.
        "422":
          description: Material title is invalid.
  /api/courses/{courseId}/materials/{materialId}/download:
    parameters:
      - $ref: "#/components/parameters/CourseId"
      - name: materialId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags: [M1 Core]
      summary: Stream an authorized course material
      operationId: downloadCourseMaterial
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The original filename is sent as an attachment after access checks.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          description: Caller is neither the course owner nor an enrolled student.
        "404":
          description: Material is not part of the course.
  /api/courses/{courseId}/schedules:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      tags: [M1 Core]
      summary: List schedules for an instructor-owned course
      operationId: listCourseSchedules
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Course sessions ordered by date and start time, including cancelled sessions.
        "403":
          description: Caller is not the instructor who owns the course.
        "404":
          description: Course not found.
    post:
      tags: [M1 Core]
      summary: Create a course session
      operationId: createCourseSchedule
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleInput"
      responses:
        "201":
          description: Session created and students notified after the transaction commits.
          content:
            application/json:
              schema:
                type: object
                required: [schedule]
                properties:
                  schedule:
                    $ref: "#/components/schemas/Schedule"
        "403":
          description: Caller is not the instructor who owns the course.
        "404":
          description: Course not found.
        "409":
          description: Session overlaps an existing active session, or the course is archived.
        "422":
          description: Session date, time, or details are invalid.
  /api/schedules/{scheduleId}:
    parameters:
      - $ref: "#/components/parameters/ScheduleId"
    patch:
      tags: [M1 Core]
      summary: Update a course session
      operationId: updateSchedule
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleUpdate"
      responses:
        "200":
          description: Session updated; date/time changes set status to RESCHEDULED.
          content:
            application/json:
              schema:
                type: object
                required: [schedule]
                properties:
                  schedule:
                    $ref: "#/components/schemas/Schedule"
        "403":
          description: Caller is not the instructor who owns the course.
        "404":
          description: Session not found.
        "409":
          description: Updated time overlaps another active session, or the course is archived.
        "422":
          description: Session date, time, or details are invalid.
    delete:
      tags: [M1 Core]
      summary: Cancel a course session without deleting it
      operationId: cancelSchedule
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Session status is CANCELLED and enrolled students are notified after commit.
        "403":
          description: Caller is not the instructor who owns the course.
        "404":
          description: Session not found.
        "409":
          description: The course is archived.
  /api/courses:
    get:
      tags: [M1 Core]
      summary: List courses visible to the authenticated user
      operationId: listCourses
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Courses visible to the current user.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Course"
        "401":
          description: Authentication is required.
    post:
      tags: [M1 Core]
      summary: Create a draft course
      operationId: createCourse
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseInput"
      responses:
        "201":
          description: Course created in DRAFT status.
          content:
            application/json:
              schema:
                type: object
                required: [course]
                properties:
                  course:
                    $ref: "#/components/schemas/Course"
        "403":
          description: Only an instructor can create a course.
        "422":
          description: Course input is invalid.
  /api/courses/enroll:
    post:
      tags: [M1 Core]
      summary: Enroll in a published course using its case-sensitive key
      operationId: enrollByCode
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrollment_key]
              properties:
                enrollment_key:
                  type: string
                  minLength: 6
                  maxLength: 8
      responses:
        "201":
          description: Enrollment created.
        "400":
          description: Enrollment key is required.
        "403":
          description: Only a student can enroll.
        "404":
          description: Key not found or course is not published.
        "409":
          description: Student is already enrolled.
        "429":
          description: Enrollment rate limit exceeded.
  /api/courses/{courseId}:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      tags: [M1 Core]
      summary: Get a course visible to the authenticated user
      operationId: getCourse
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Course details.
          content:
            application/json:
              schema:
                type: object
                required: [course]
                properties:
                  course:
                    $ref: "#/components/schemas/Course"
        "403":
          description: User cannot access this course.
        "404":
          description: Course not found.
    patch:
      tags: [M1 Core]
      summary: Update course details
      operationId: updateCourse
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseUpdate"
      responses:
        "200":
          description: Course updated.
        "403":
          description: Caller is not the course owner.
        "404":
          description: Course not found.
        "409":
          description: Course is archived or enrollment key is already used.
        "422":
          description: Course input is invalid.
    delete:
      tags: [M1 Core]
      summary: Soft-delete an empty course or archive a course with data
      operationId: deleteOrArchiveCourse
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Course was archived or soft-deleted; it was never hard-deleted.
          content:
            application/json:
              schema:
                type: object
                required: [courseId, status, archived]
                properties:
                  courseId:
                    type: integer
                  status:
                    type: string
                    enum: [DRAFT, PUBLISHED, ARCHIVED]
                  archived:
                    type: boolean
                  deleted:
                    type: boolean
        "403":
          description: Caller is not the course owner.
        "404":
          description: Course not found.
  /api/courses/{courseId}/publish:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    patch:
      tags: [M1 Core]
      summary: Publish a draft course and enable enrollment
      operationId: publishCourse
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Course is published.
        "403":
          description: Caller is not the course owner.
        "404":
          description: Course not found.
        "409":
          description: Archived courses cannot be published.
  /api/courses/{courseId}/archive:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    patch:
      tags: [M1 Core]
      summary: Archive a course
      operationId: archiveCourse
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Course is archived and read-only.
        "403":
          description: Caller is neither an administrator nor the course owner.
        "404":
          description: Course not found.
  /api/courses/{courseId}/enrollments/{studentId}:
    parameters:
      - $ref: "#/components/parameters/CourseId"
      - name: studentId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    delete:
      tags: [M1 Core]
      summary: Remove an enrolled student who has no assessment or quiz records
      operationId: removeEnrollment
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Enrollment removed.
        "403":
          description: Caller is neither an administrator nor the course owner.
        "404":
          description: Course or enrollment not found.
        "409":
          description: Student has assessment or quiz data, or the enrollment changed.
  /api/m1-core/ping:
    get:
      tags: [M1 Core]
      summary: Check M1 module availability
      operationId: getM1Ping
      responses:
        "200":
          description: M1 module is operational.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  module:
                    type: string
                    example: m1-core
components:
  parameters:
    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    LessonId:
      name: lessonId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ScheduleId:
      name: scheduleId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Course:
      type: object
      required: [id, code, title, semester, ownerId, status]
      properties:
        id:
          type: integer
        code:
          type: string
          maxLength: 20
        title:
          type: string
          maxLength: 200
        description:
          type: string
          nullable: true
        semester:
          type: string
          maxLength: 20
        ownerId:
          type: integer
        enrollment_key:
          type: string
          minLength: 6
          maxLength: 8
        status:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]
    ManagedUser:
      type: object
      required:
        [id, username, email, fullName, role, status, mustChangePassword]
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          type: string
          enum: [ADMIN, GIANG_VIEN, SINH_VIEN]
        status:
          type: string
          enum: [ACTIVE, LOCKED, TEMPORARY_LOCKED]
        mustChangePassword:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateUser:
      type: object
      required: [fullName, username, email, role]
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 100
        username:
          type: string
          minLength: 1
          maxLength: 50
        email:
          type: string
          format: email
          maxLength: 100
        role:
          type: string
          enum: [ADMIN, GIANG_VIEN, SINH_VIEN]
    LessonInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          nullable: true
        orderIndex:
          type: integer
          minimum: 1
    CourseInput:
      type: object
      required: [code, title, semester]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 20
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
        semester:
          type: string
          minLength: 1
          maxLength: 20
        enrollmentKey:
          type: string
          pattern: "^[A-Za-z0-9]{6,8}$"
          description: Omit to generate a unique six-character uppercase alphanumeric key.
    CourseUpdate:
      type: object
      minProperties: 1
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 20
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
        semester:
          type: string
          minLength: 1
          maxLength: 20
        enrollmentKey:
          type: string
          pattern: "^[A-Za-z0-9]{6,8}$"
    Schedule:
      type: object
      required: [id, courseId, title, date, startTime, endTime, roomOrLink, status]
      properties:
        id:
          type: integer
        courseId:
          type: integer
        title:
          type: string
          maxLength: 200
        date:
          type: string
          format: date
        startTime:
          type: string
          format: time
        endTime:
          type: string
          format: time
        roomOrLink:
          type: string
          maxLength: 255
        status:
          type: string
          enum: [SCHEDULED, RESCHEDULED, CANCELLED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ScheduleInput:
      type: object
      required: [title, date, startTime, endTime, roomOrLink]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        date:
          type: string
          format: date
        startTime:
          type: string
          pattern: "^(?:[01]\\d|2[0-3]):[0-5]\\d(?::[0-5]\\d)?$"
        endTime:
          type: string
          pattern: "^(?:[01]\\d|2[0-3]):[0-5]\\d(?::[0-5]\\d)?$"
        roomOrLink:
          type: string
          minLength: 1
          maxLength: 255
    ScheduleUpdate:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        date:
          type: string
          format: date
        startTime:
          type: string
          pattern: "^(?:[01]\\d|2[0-3]):[0-5]\\d(?::[0-5]\\d)?$"
        endTime:
          type: string
          pattern: "^(?:[01]\\d|2[0-3]):[0-5]\\d(?::[0-5]\\d)?$"
        roomOrLink:
          type: string
          minLength: 1
          maxLength: 255
    AuthSession:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          type: object
          required: [id, role, must_change_password]
          properties:
            id:
              oneOf:
                - type: integer
                - type: string
            role:
              type: string
              enum: [ADMIN, GIANG_VIEN, SINH_VIEN]
            must_change_password:
              type: boolean
