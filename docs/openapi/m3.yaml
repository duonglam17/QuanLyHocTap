openapi: 3.0.3
info:
  title: LMS Mini M3 API
  version: 1.0.0
  description: M3 endpoints are documented by the module owner.
servers:
  - url: http://localhost:5000
tags:
  - name: M3 Quiz
  - name: M3 Notifications
  - name: M3 Discussions
paths:
  /api/notifications:
    get:
      tags:
        - M3 Notifications
      summary: List the authenticated user's notifications
      operationId: listMyNotifications
      security:
        - bearerAuth: []
      x-user-story: US-07
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Notifications belonging to the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '401':
          description: Authentication is required
  /api/notifications/{notificationId}/read:
    patch:
      tags:
        - M3 Notifications
      summary: Mark one of the authenticated user's notifications as read
      operationId: markMyNotificationRead
      security:
        - bearerAuth: []
      x-user-story: US-07
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[1-9]\d*$'
      responses:
        '200':
          description: Notification marked as read
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - isRead
                properties:
                  id:
                    type: string
                  isRead:
                    type: boolean
                    example: true
        '401':
          description: Authentication is required
        '404':
          description: Notification does not belong to the authenticated user or does not exist
  /api/courses/{courseId}/quizzes:
    get:
      tags:
        - M3 Quiz
      summary: List quizzes visible to the current course owner or enrolled student
      operationId: listCourseQuizzes
      security:
        - bearerAuth: []
      x-user-story: US-10
      x-roles:
        - GIANG_VIEN
        - SINH_VIEN
      x-allowed-roles:
        - GIANG_VIEN
        - SINH_VIEN
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[1-9]\d*$'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Owner sees all quizzes; an enrolled student sees only published quizzes and their own attempt state and attemptId. The schema allows one attempt per student and quiz.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseQuizPage'
              examples:
                courseOwner:
                  value:
                    items:
                      - id: 55
                        courseId: 1
                        title: Kiểm tra giữa kỳ
                        description: Chương 1 đến chương 3
                        durationMinutes: 30
                        openTime: '2026-11-25T01:00:00.000Z'
                        closeTime: '2026-11-25T03:00:00.000Z'
                        showScoreImmediately: true
                        status: DRAFT
                        questionCount: 3
                        hasAttempts: false
                    page: 1
                    limit: 20
                    total: 1
                enrolledStudent:
                  value:
                    items:
                      - id: 55
                        courseId: 1
                        title: Kiểm tra giữa kỳ
                        description: Chương 1 đến chương 3
                        durationMinutes: 30
                        openTime: '2026-11-25T01:00:00.000Z'
                        closeTime: '2026-11-25T03:00:00.000Z'
                        status: PUBLISHED
                        attemptId: null
                        attemptStatus: NOT_STARTED
                        canStart: true
                        visibleToStudent: false
                    page: 1
                    limit: 20
                    total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags:
        - M3 Quiz
      summary: Create a draft quiz and its initial questions
      operationId: createQuiz
      security:
        - bearerAuth: []
      x-user-story: US-10
      x-allowed-roles:
        - GIANG_VIEN
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[1-9]\d*$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuizRequest'
            example:
              title: Kiem tra giua ky
              description: Kiem tra chuong 1 den chuong 3
              duration_minutes: 30
              open_time: '2026-11-25 08:00:00'
              close_time: '2026-11-25 10:00:00'
              show_score_immediately: true
              questions:
                - content: Cau hoi mau?
                  options:
                    - content: Dap an A
                      is_correct: true
                    - content: Dap an B
                      is_correct: false
      responses:
        '201':
          description: Draft quiz created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quiz'
        '400':
          description: Invalid quiz or question data
        '422':
          description: Quiz data failed validation
        '401':
          description: Authentication is required
        '403':
          description: Caller is not the course owner
        '404':
          description: Course does not exist
        '409':
          description: Course is archived and read-only
  /api/quizzes/{quizId}:
    get:
      tags:
        - M3 Quiz
      summary: Get quiz details for its owner or general quiz information for an enrolled student
      operationId: getQuiz
      security:
        - bearerAuth: []
      x-user-story: US-10
      x-roles:
        - GIANG_VIEN
        - SINH_VIEN
      x-allowed-roles:
        - GIANG_VIEN
        - SINH_VIEN
      parameters:
        - name: quizId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[1-9]\d*$'
      responses:
        '200':
          description: Owner receives questions with correctness flags; students receive general data only
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/QuizOwnerDetail'
                  - $ref: '#/components/schemas/QuizStudentDetail'
              examples:
                owner:
                  value:
                    id: 55
                    courseId: 1
                    title: Kiểm tra giữa kỳ
                    description: Chương 1 đến chương 3
                    durationMinutes: 30
                    openTime: '2026-11-25T01:00:00.000Z'
                    closeTime: '2026-11-25T03:00:00.000Z'
                    showScoreImmediately: true
                    status: DRAFT
                    hasAttempts: false
                    questions:
                      - id: 90
                        content: Câu hỏi mẫu?
                        orderIndex: 1
                        options:
                          - id: 91
                            content: Lựa chọn A
                            isCorrect: true
                            orderIndex: 1
                enrolledStudent:
                  value:
                    id: 55
                    courseId: 1
                    title: Kiểm tra giữa kỳ
                    description: Chương 1 đến chương 3
                    durationMinutes: 30
                    openTime: '2026-11-25T01:00:00.000Z'
                    closeTime: '2026-11-25T03:00:00.000Z'
                    showScoreImmediately: true
                    status: PUBLISHED
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      tags:
        - M3 Quiz
      summary: Update quiz settings before any attempt exists
      description: Published quizzes may be updated while they have no attempts. Once an attempt exists, changes are locked with the same CONFLICT error as question updates (EC-07).
      operationId: updateQuiz
      security:
        - bearerAuth: []
      x-user-story: US-10
      x-roles:
        - GIANG_VIEN
      x-allowed-roles:
        - GIANG_VIEN
      parameters:
        - name: quizId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[1-9]\d*$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQuizRequest'
            example:
              title: Kiểm tra giữa kỳ đã cập nhật
              description: Chương 1 đến chương 4
              duration_minutes: 45
              open_time: '2026-11-25 08:00:00'
              close_time: '2026-11-25 10:00:00'
              show_score_immediately: false
      responses:
        '200':
          description: Quiz settings updated and the complete owner representation returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizOwnerDetail'
              example:
                id: 55
                courseId: 1
                title: Kiểm tra giữa kỳ đã cập nhật
                description: Chương 1 đến chương 4
                durationMinutes: 45
                openTime: '2026-11-25T01:00:00.000Z'
                closeTime: '2026-11-25T03:00:00.000Z'
                showScoreImmediately: false
                status: PUBLISHED
                hasAttempts: false
                questions: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/quizzes/{quizId}/questions:
    put:
      tags:
        - M3 Quiz
      summary: Replace questions before the quiz has attempts
      operationId: replaceQuizQuestions
      security:
        - bearerAuth: []
      x-user-story: US-10
      x-allowed-roles:
        - GIANG_VIEN
      parameters:
        - name: quizId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[1-9]\d*$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - questions
              properties:
                questions:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/QuizQuestionInput'
      responses:
        '200':
          description: Quiz questions replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quiz'
        '400':
          description: Invalid question data
        '422':
          description: Question data failed validation
        '401':
          description: Authentication is required
        '403':
          description: Caller is not the course owner
        '404':
          description: Quiz does not exist
        '409':
          description: Quiz has attempts or its course is archived
  /api/questions/{questionId}:
    delete:
      tags:
        - M3 Quiz
      summary: Delete a question before the quiz has attempts
      operationId: deleteQuizQuestion
      security:
        - bearerAuth: []
      x-user-story: US-10
      x-allowed-roles:
        - GIANG_VIEN
      parameters:
        - name: questionId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[1-9]\d*$'
      responses:
        '200':
          description: Question deleted
        '401':
          description: Authentication is required
        '403':
          description: Caller is not the course owner
        '404':
          description: Question does not exist
        '409':
          description: Quiz has attempts or cannot be left without questions
  /api/quizzes/{quizId}/publish:
    post:
      tags:
        - M3 Quiz
      summary: Publish a draft quiz that has at least one question
      operationId: publishQuiz
      security:
        - bearerAuth: []
      x-user-story: US-10
      x-allowed-roles:
        - GIANG_VIEN
      parameters:
        - name: quizId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[1-9]\d*$'
      responses:
        '200':
          description: Quiz published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quiz'
        '422':
          description: Quiz must contain at least one question
        '401':
          description: Authentication is required
        '403':
          description: Caller is not the course owner
        '404':
          description: Quiz does not exist
        '409':
          description: Quiz is not a draft or its course is archived
  /api/quizzes/{quizId}/start:
    post:
      tags:
        - M3 Quiz
      summary: Start or resume the authenticated student's quiz attempt
      operationId: startOrResumeQuizAttempt
      security:
        - bearerAuth: []
      x-user-story: US-11
      x-allowed-roles:
        - SINH_VIEN
      parameters:
        - name: quizId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[1-9]\d*$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAttemptRequest'
            example:
              clientInstanceId: 22c0414d-547c-47d6-b469-45ead5687ea2
              takeOver: false
      responses:
        '200':
          description: Attempt started or resumed for this client instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptSession'
        '401':
          description: Authentication is required
        '403':
          description: Student is not enrolled in the course
        '404':
          description: Quiz or course does not exist
        '409':
          description: |
            The quiz is not open, the attempt has expired or was submitted,
            another client instance owns the session, or the takeover limit was reached.
            Conflict responses contain only the standard error envelope and never include questions or answers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptConflict'
              examples:
                activeElsewhere:
                  value:
                    code: SESSION_ACTIVE_ELSEWHERE
                    message: Lượt thi đang hoạt động ở một cửa sổ khác.
                    details: null
                takeoverLimit:
                  value:
                    code: SESSION_TAKEOVER_LIMIT
                    message: Đã vượt quá số lần chiếm quyền phiên cho lượt thi này.
                    details: null
  /api/attempts/{attemptId}/save-answer:
    patch:
      tags:
        - M3 Quiz
      summary: Save one answer for the authenticated student's active attempt
      operationId: saveQuizAttemptAnswer
      security:
        - bearerAuth: []
      x-user-story: US-11
      x-allowed-roles:
        - SINH_VIEN
      parameters:
        - name: attemptId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[1-9]\d*$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveAttemptAnswerRequest'
      responses:
        '200':
          description: Answer saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveAttemptAnswerResponse'
        '401':
          description: Authentication is required
        '403':
          description: Attempt does not belong to the authenticated student
        '404':
          description: Attempt does not exist
        '409':
          description: |
            The attempt expired, was submitted, or this client session has been replaced.
            SESSION_REPLACED responses never include questions or answers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptConflict'
              examples:
                sessionReplaced:
                  value:
                    code: SESSION_REPLACED
                    message: Phiên làm bài này đã được thay thế.
                    details: null
        '422':
          description: Question, option, or session input is invalid
  /api/attempts/{attemptId}/submit:
    post:
      tags:
        - M3 Quiz
      summary: Submit and automatically grade the authenticated student's attempt
      operationId: submitQuizAttempt
      security:
        - bearerAuth: []
      x-user-story: US-12
      x-allowed-roles:
        - SINH_VIEN
      parameters:
        - name: attemptId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[1-9]\d*$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAttemptRequest'
      responses:
        '200':
          description: Attempt submitted or prior submission result returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptSubmissionResult'
        '401':
          description: Authentication is required
        '403':
          description: Attempt does not belong to the authenticated student
        '404':
          description: Attempt does not exist
        '409':
          description: Session has been replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptConflict'
              examples:
                sessionReplaced:
                  value:
                    code: SESSION_REPLACED
                    message: Phiên làm bài này đã được thay thế.
                    details: null
        '422':
          description: Session input is invalid
  /api/attempts/{attemptId}/result:
    get:
      tags:
        - M3 Quiz
      summary: Read a quiz attempt result without question or answer content
      description: |
        The attempt owner may read their own result; the course owner may read any attempt result in their course.
        Archived courses remain readable. Expired in-progress attempts are auto-submitted and graded before the result is returned.
        Scores and correct counts are null until grading is complete and the score is visible to students.
      operationId: getQuizAttemptResult
      security:
        - bearerAuth: []
      x-user-story: US-12
      x-allowed-roles:
        - SINH_VIEN
        - GIANG_VIEN
      parameters:
        - name: attemptId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[1-9]\d*$'
      responses:
        '200':
          description: Attempt result, including an in-progress state when not yet submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptResult'
              examples:
                visibleSubmittedResult:
                  value:
                    attemptId: 71
                    quizId: 5
                    quizTitle: Kiểm tra chương 1
                    status: SUBMITTED
                    startedAt: '2026-11-25T07:30:00.000Z'
                    submittedAt: '2026-11-25T08:00:00.000Z'
                    expiresAt: '2026-11-25T08:30:00.000Z'
                    totalQuestions: 10
                    answeredCount: 9
                    visibleToStudent: true
                    maxScore: 10
                    score: 8
                    correctCount: 8
                inProgress:
                  value:
                    attemptId: 71
                    quizId: 5
                    quizTitle: Kiểm tra chương 1
                    status: IN_PROGRESS
                    startedAt: '2026-11-25T07:30:00.000Z'
                    submittedAt: null
                    expiresAt: '2026-11-25T08:30:00.000Z'
                    totalQuestions: 10
                    answeredCount: 4
                    visibleToStudent: false
                    maxScore: 10
                    score: null
                    correctCount: null
        '401':
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: UNAUTHORIZED
                message: Chưa xác thực hoặc phiên đăng nhập không hợp lệ.
                details: null
        '403':
          description: Caller is neither the attempt owner nor the course owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: FORBIDDEN
                message: Bạn không có quyền xem kết quả lượt thi.
                details: null
        '404':
          description: Attempt or its course does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: NOT_FOUND
                message: Không tìm thấy lượt thi.
                details: null
        '422':
          description: Attempt identifier is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: VALIDATION_ERROR
                message: Dữ liệu đầu vào không hợp lệ.
                details: null
  /api/courses/{courseId}/announcements:
    get:
      tags:
        - M3 Notifications
      summary: List paginated announcements for an enrolled course member
      operationId: listCourseAnnouncements
      security:
        - bearerAuth: []
      x-user-story: US-15
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[1-9]\d*$'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Announcements ordered newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementPage'
        '401':
          description: Authentication is required
        '403':
          description: Caller is not enrolled in or responsible for the course
        '404':
          description: Course does not exist
    post:
      tags:
        - M3 Notifications
      summary: Create a course announcement and notify enrolled students
      operationId: createCourseAnnouncement
      security:
        - bearerAuth: []
      x-user-story: US-15
      x-allowed-roles:
        - GIANG_VIEN
        - ADMIN
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[1-9]\d*$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnnouncementRequest'
      responses:
        '201':
          description: Announcement created; notification dispatch is best effort after commit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
        '401':
          description: Authentication is required
        '403':
          description: Caller is not the course owner or Admin
        '404':
          description: Course does not exist
        '409':
          description: Course is archived and read-only
        '422':
          description: Title or content is invalid
  /api/announcements/{announcementId}:
    delete:
      tags:
        - M3 Notifications
      summary: Delete an announcement as its course owner or an Admin
      operationId: deleteCourseAnnouncement
      security:
        - bearerAuth: []
      x-user-story: US-15
      x-allowed-roles:
        - GIANG_VIEN
        - ADMIN
      parameters:
        - name: announcementId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[1-9]\d*$'
      responses:
        '200':
          description: Announcement deleted
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - deleted
                properties:
                  id:
                    type: string
                  deleted:
                    type: boolean
                    enum:
                      - true
        '401':
          description: Authentication is required
        '403':
          description: Caller is not the course owner or Admin
        '404':
          description: Announcement or course does not exist
        '409':
          description: Course is archived and read-only
  /api/lessons/{lessonId}/comments:
    get:
      tags:
        - M3 Discussions
      summary: List paginated discussion threads for a lesson
      operationId: listLessonDiscussions
      security:
        - bearerAuth: []
      x-user-story: US-16
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[1-9]\d*$'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated root discussions with their replies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscussionPage'
        '401':
          description: Authentication is required
        '403':
          description: Caller is not enrolled in or owner of the course
        '404':
          description: Lesson or course does not exist
    post:
      tags:
        - M3 Discussions
      summary: Create a discussion comment under a lesson
      operationId: createLessonDiscussion
      security:
        - bearerAuth: []
      x-user-story: US-16
      x-allowed-roles:
        - SINH_VIEN
        - GIANG_VIEN
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[1-9]\d*$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscussionContentRequest'
      responses:
        '201':
          description: Discussion created with sanitized content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Discussion'
        '401':
          description: Authentication is required
        '403':
          description: Caller is not enrolled in or owner of the course
        '404':
          description: Lesson or course does not exist
        '422':
          description: Content is empty or invalid
  /api/comments/{commentId}/replies:
    post:
      tags:
        - M3 Discussions
      summary: Reply to a discussion comment
      operationId: replyToDiscussion
      security:
        - bearerAuth: []
      x-user-story: US-16
      x-allowed-roles:
        - SINH_VIEN
        - GIANG_VIEN
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[1-9]\d*$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscussionContentRequest'
      responses:
        '201':
          description: Reply created in the comment's root discussion thread
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Discussion'
        '401':
          description: Authentication is required
        '403':
          description: Caller is not enrolled in or owner of the course
        '404':
          description: Comment, lesson, or course does not exist
        '422':
          description: Content is empty or invalid
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Request is malformed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: BAD_REQUEST
            message: Yêu cầu không hợp lệ.
            details: null
    Unauthorized:
      description: Authentication is required or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: UNAUTHORIZED
            message: Chưa xác thực hoặc phiên đăng nhập không hợp lệ.
            details: null
    Forbidden:
      description: Caller is not allowed to access this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: FORBIDDEN
            message: Bạn không có quyền truy cập đề thi.
            details: null
    NotFound:
      description: Course or quiz does not exist or is not visible to this student
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: NOT_FOUND
            message: Không tìm thấy đề thi.
            details: null
    Conflict:
      description: Quiz is locked for editing or the course is archived
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            quizHasAttempts:
              value:
                code: CONFLICT
                message: Không thể chỉnh sửa đề thi khi đã có thí sinh làm bài.
                details: null
            courseArchived:
              value:
                code: COURSE_ARCHIVED
                message: Khóa học không tồn tại hoặc đã lưu trữ.
                details: null
    ValidationError:
      description: Input failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: VALIDATION_ERROR
            message: Dữ liệu đầu vào không hợp lệ.
            details:
              - path: query.page
                code: too_small
                message: Number must be greater than or equal to 1
  schemas:
    ApiError:
      type: object
      required:
        - code
        - message
        - details
      properties:
        code:
          type: string
        message:
          type: string
        details:
          anyOf:
            - type: array
              nullable: true
              items:
                type: object
                properties:
                  path:
                    type: string
                  code:
                    type: string
                  message:
                    type: string
            - type: object
              nullable: true
            - type: string
              nullable: true
    Notification:
      type: object
      required:
        - id
        - userId
        - title
        - message
        - type
        - isRead
        - createdAt
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        courseId:
          type: integer
          format: int64
          nullable: true
        title:
          type: string
        message:
          type: string
        type:
          type: string
          enum:
            - NEW_ASSIGNMENT
            - ASSIGNMENT_GRADED
            - ANNOUNCEMENT
            - SCHEDULE_CHANGED
        refType:
          type: string
          nullable: true
        refId:
          type: string
          nullable: true
        link:
          type: string
          nullable: true
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time
    NotificationPage:
      type: object
      required:
        - items
        - page
        - limit
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
    QuizOptionInput:
      type: object
      required:
        - content
        - is_correct
      properties:
        content:
          type: string
          minLength: 1
        is_correct:
          type: boolean
    QuizQuestionInput:
      type: object
      description: Each question must have exactly one option with is_correct set to true.
      required:
        - content
        - options
      properties:
        content:
          type: string
          minLength: 1
        options:
          type: array
          minItems: 2
          maxItems: 5
          items:
            $ref: '#/components/schemas/QuizOptionInput'
    CreateQuizRequest:
      type: object
      required:
        - title
        - duration_minutes
        - open_time
        - close_time
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
        duration_minutes:
          type: integer
          minimum: 1
        open_time:
          type: string
          example: '2026-11-25 08:00:00'
        close_time:
          type: string
          example: '2026-11-25 10:00:00'
        show_score_immediately:
          type: boolean
          default: true
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuizQuestionInput'
    QuizOption:
      allOf:
        - $ref: '#/components/schemas/QuizOptionInput'
        - type: object
          required:
            - id
            - orderIndex
          properties:
            id:
              type: integer
              format: int64
            orderIndex:
              type: integer
    QuizQuestion:
      type: object
      required:
        - id
        - content
        - orderIndex
        - options
      properties:
        id:
          type: integer
          format: int64
        content:
          type: string
        orderIndex:
          type: integer
        options:
          type: array
          items:
            $ref: '#/components/schemas/QuizOption'
    Quiz:
