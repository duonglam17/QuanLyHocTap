openapi: 3.0.3
info:
  title: LMS Mini M2 API
  version: 1.0.0
  description: M2 assignment, grading, and personal gradebook endpoints.
servers:
  - url: http://localhost:5000
tags:
  - name: M2 Assessment
paths:
  /api/assignments/{id}:
    get:
      tags: [M2 Assessment]
      summary: Get assignment details for an enrolled student or course owner
      operationId: getAssignmentDetail
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assignment details.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Assignment'
        "401":
          description: Authentication is required.
        "403":
          description: The caller is not the course owner or an enrolled student.
        "404":
          description: The assignment does not exist.
  /api/assignments/{assignmentId}/submissions/me:
    get:
      tags: [M2 Assessment]
      summary: Get the authenticated student's submission for an assignment
      description: Student identity is derived from the bearer token, never from a request parameter.
      operationId: getMyAssignmentSubmission
      security:
        - bearerAuth: []
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The student's current submission, or null when not submitted.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/Submission'
                      - type: object
                        nullable: true
        "401":
          description: Authentication is required.
        "403":
          description: The caller is not an enrolled student.
        "404":
          description: The assignment does not exist.
    post:
      tags: [M2 Assessment]
      summary: Submit or resubmit an assignment file
      description: >
        Server time determines whether the submission is late. Resubmission
        updates the existing submission and increments submission_count.
      operationId: submitAssignment
      security:
        - bearerAuth: []
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF, DOCX, PPTX, ZIP, or RAR file up to 20 MiB.
      responses:
        "201":
          description: First submission accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResponse'
        "200":
          description: Resubmission accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResponse'
        "400":
          description: The request or uploaded file is invalid.
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ApiError'
        "401":
          description: Authentication is required.
        "403":
          description: The caller cannot submit or submission is past a forbidden deadline.
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ApiError'
        "413":
          description: The upload exceeds the 20 MiB limit.
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ApiError'
        "429":
          description: The upload rate limit was exceeded.
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ApiError'
  /api/courses/{courseId}/grades/submissions:
    get:
      tags: [M2 Assessment]
      summary: List assignment submissions in a course for the course owner
      operationId: listCourseSubmissionsForGrading
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paginated assignment submissions and existing grades.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseSubmissionListResponse'
        "401":
          description: Authentication is required.
        "403":
          description: The caller is not the course owner.
        "422":
          description: The course ID or pagination parameters are invalid.
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ApiError'
  /api/submissions/{submissionId}/download:
    get:
      tags: [M2 Assessment]
      summary: Download a submission file as the course owner
      operationId: downloadSubmissionForGrading
      security:
        - bearerAuth: []
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Original submission file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          description: Authentication is required.
        "403":
          description: The caller does not own the submission course.
        "404":
          description: The submission or stored file does not exist.
  /api/submissions/{submissionId}/grade:
    post:
      tags: [M2 Assessment]
      summary: Grade or update a submission grade
      operationId: gradeSubmission
      security:
        - bearerAuth: []
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score:
                  type: number
                  minimum: 0
                  maximum: 10
                  multipleOf: 0.25
                feedback:
                  type: string
      responses:
        "200":
          description: Grade saved and submission marked as graded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeResponse'
        "401":
          description: Authentication is required.
        "403":
          description: The caller does not own the submission course or it is read-only.
        "404":
          description: The submission does not exist.
        "422":
          description: The score or feedback is invalid.
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ApiError'
  /api/m2-assessment/courses/{courseId}/my-grades:
    get:
      tags: [M2 Assessment]
      summary: Get the authenticated student's personal course gradebook
      description: >
        Student identity is derived from the authenticated bearer token.
        The request does not accept a student_id. Unsubmitted or ungraded
        assignments have a null score. Quiz scores hidden from students are omitted.
      operationId: getMyCourseGrades
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Personal assignment and quiz scores.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentGradebookResponse'
        "401":
          description: Authentication is required.
        "403":
          description: The caller is not a student enrolled in this course.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Assignment:
      type: object
      required: [id, course_id, title, description, due_date, max_score, allow_late_submission, status]
      properties:
        id:
          type: integer
        course_id:
          type: integer
        title:
          type: string
        description:
          type: string
        due_date:
          type: string
          format: date-time
        deadline:
          type: string
          format: date-time
        max_score:
          type: number
        allow_late_submission:
          type: boolean
        status:
          type: string
    SubmissionResponse:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/Submission'
    Submission:
      type: object
      required:
        [id, assignment_id, student_id, original_filename, file_size_bytes, mime_type, submitted_at, is_late, late_minutes, submission_count, status]
      properties:
        id:
          type: integer
        assignment_id:
          type: integer
        student_id:
          type: integer
        original_filename:
          type: string
        file_size_bytes:
          type: integer
        mime_type:
          type: string
        submitted_at:
          type: string
          format: date-time
        is_late:
          type: boolean
        late_minutes:
          type: integer
        submission_count:
          type: integer
        status:
          type: string
          enum: [SUBMITTED, SUBMITTED_LATE, GRADED]
    CourseSubmissionListResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/CourseSubmission'
        pagination:
          $ref: '#/components/schemas/Pagination'
    CourseSubmission:
      allOf:
        - $ref: '#/components/schemas/Submission'
        - type: object
          required: [student_name, score, feedback]
          properties:
            student_name:
              type: string
              nullable: true
            assignment_title:
              type: string
            score:
              type: number
              nullable: true
            feedback:
              type: string
              nullable: true
            graded_at:
              type: string
              format: date-time
              nullable: true
    Pagination:
      type: object
      required: [page, page_size, total, total_pages]
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
    GradeResponse:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/Grade'
    Grade:
      type: object
      required: [id, submission_id, graded_by, score, feedback, graded_at, updated_at]
      properties:
        id:
          type: integer
        submission_id:
          type: integer
        graded_by:
          type: integer
        score:
          type: number
        feedback:
          type: string
        graded_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    StudentGradebookResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: object
          required: [course_id, assignments, quizzes]
          properties:
            course_id:
              type: integer
            assignments:
              type: array
              items:
                $ref: '#/components/schemas/GradebookItem'
            quizzes:
              type: array
              items:
                $ref: '#/components/schemas/GradebookItem'
    GradebookItem:
      type: object
      required: [type, id, title, score]
      properties:
        type:
          type: string
          enum: [ASSIGNMENT, QUIZ]
        id:
          type: integer
        title:
          type: string
        score:
          type: number
          nullable: true
        maxScore:
          type: number
          nullable: true
        feedback:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        visibleToStudent:
          type: boolean
