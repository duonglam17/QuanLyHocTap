name: E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  playwright:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: e2e-root-password
          MYSQL_DATABASE: lms_e2e
          TZ: Asia/Ho_Chi_Minh
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: e2e-root-password
      DB_NAME: lms_e2e
      DB_ADMIN_USER: root
      DB_ADMIN_PASSWORD: e2e-root-password
      JWT_SECRET: e2e-only-ci-secret-change-before-use-123456
      PORT: 5001
      E2E_BACKEND_URL: http://127.0.0.1:5001
      E2E_BASE_URL: http://127.0.0.1:5174
      E2E_FRONTEND_PORT: 5174
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm ci --prefix e2e
      - run: npx --prefix e2e playwright install --with-deps chromium
      - run: npm run db:reset --prefix e2e

      - name: Run Playwright smoke on pull requests
        if: github.event_name == 'pull_request'
        run: npm run test:smoke --prefix e2e

      - name: Run full Playwright suite on main
        if: github.event_name == 'push'
        run: npm test --prefix e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/.generated/
          if-no-files-found: ignore
          retention-days: 14
