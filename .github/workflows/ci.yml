name: LMS Mini Continuous Integration (CI)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend-ci:
    name: Frontend (Lint, Test, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Check Code Quality (ESLint)
        run: npm run lint

      - name: Run Frontend Tests (Vitest)
        run: npm run test

      - name: Build Production Assets (Vite)
        run: npm run build

  backend-ci:
    name: Backend Check (Conditional)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check if backend package.json exists
        id: check_backend
        run: |
          if [ -f "backend/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "backend/package.json chua ton tai. Bo qua buoc kiem tra backend."
          fi

      - name: Run Backend Tests (if present)
        if: steps.check_backend.outputs.exists == 'true'
        working-directory: backend
        run: |
          npm ci
          npm test --if-present

